name: Backfill from Openwall

# One year per run (GHA hosted runners cap at 6h; a full year of scraping
# at 1.5s/req should fit comfortably). Run in reverse order (newest year
# first) by triggering with year=2015, then 2014, then …, down to 2008.
#
# Each year's run produces a single commit; idempotent against prior runs
# (public-inbox dedups on Message-ID, and openwall-scrape.pl resumes from
# its $maildir/.scrape-state file if re-run with the same scratch dir,
# though here the scratch dir is per-run so resume only matters within
# a single workflow execution).

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to backfill (e.g. 2014)'
        required: true
        type: string
      reverse_days:
        description: 'Iterate days within the year newest→oldest'
        required: false
        default: 'false'
        type: string

jobs:
  backfill:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark run start (for status.json last_run.duration_s)
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            public-inbox xapian-tools \
            libwww-perl liblwp-protocol-https-perl libhtml-parser-perl \
            libhtml-format-perl libcpanel-json-xs-perl

      - name: Initialize inbox (idempotent — writes config on every run)
        # setup-inbox.sh is safe to run against an already-initialized inbox
        # (it skips public-inbox-init but still registers the inbox in
        # ~/.public-inbox/config, which every fresh runner needs).
        run: ./scripts/setup-inbox.sh inbox

      - name: Prime search index for --diff-against
        # inbox/xap15/over.sqlite3 is what openwall-scrape.pl's
        # --diff-against queries to skip messages already in the
        # archive. That file is gitignored (indexes are regenerable
        # from git objects and shouldn't bloat the repo), so a fresh
        # runner has no over.sqlite3 until public-inbox-index runs.
        # Without this step, --diff-against silently no-ops and every
        # scraped message gets ingested — creating duplicates when
        # the year overlaps the Maildir coverage window.
        # Cost: ~5-10 min for a 27k-message archive on cold Xapian.
        # Post-backfill 'Build indexes' step below re-indexes to
        # incorporate the newly-added messages.
        run: public-inbox-index inbox

      - name: Backfill
        # Inputs are env-bound (not interpolated into the shell) to defuse
        # ${{ }} → shell injection. Same hardening as the other workflows.
        env:
          YEAR: ${{ inputs.year }}
          REVERSE_DAYS: ${{ inputs.reverse_days }}
        run: |
          # Validate the year input ourselves (defense in depth — even
          # though env-binding prevents shell injection, garbage input
          # should fail loudly here rather than producing weird URLs).
          if [[ ! "$YEAR" =~ ^[0-9]{4}$ ]]; then
            echo "Error: year must be 4 digits, got: $YEAR" >&2
            exit 1
          fi
          opts=()
          if [[ "$REVERSE_DAYS" == "true" ]]; then opts+=(--reverse); fi
          # METRICS_LOG makes backfill-openwall.sh + import-maildir.sh
          # both append per-run counter lines to metrics/imports.tsv,
          # which the Commit step below reads to build the commit
          # message. Without it, the last import-maildir line in
          # metrics/imports.tsv is stale (the maildir bootstrap run
          # from months back) and the commit message reports the wrong
          # number.
          INBOX_DIR=inbox METRICS_LOG=metrics/imports.tsv \
            ./scripts/backfill-openwall.sh \
              "$YEAR-01-01" "$YEAR-12-31" "${opts[@]+${opts[@]}}"

      - name: Build indexes
        run: public-inbox-index inbox

      - name: Export index
        # DEC-ARCHIVE-007 / SPEC-index.md. Regenerates index/ (one row per
        # Message-ID — papers over stored duplicates, never purges them),
        # validates it, and writes status.json. On failure the script
        # rolls index/ back to the committed version and records the
        # error in status.json; continue-on-error lets the commit step
        # still push new mail + that error status, and the last step
        # of the job then turns the run red.
        id: export_index
        continue-on-error: true
        env:
          METRICS_LOG: metrics/imports.tsv
        run: bash scripts/publish-index.sh

      - name: Commit and push
        env:
          YEAR: ${{ inputs.year }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit (idempotent re-run, or empty year)."
          else
            # Build the commit summary from BOTH metrics lines this run
            # just appended:
            #
            #   import-maildir line (from inner import-maildir.sh):
            #     ts \t import-maildir \t total \t imported \t failed \t ...
            #     ("total" = messages the ingester saw after --diff-against
            #     already skipped duplicates; "imported" = net-new added
            #     to the archive with --diff-against enabled; "failed" =
            #     ingest errors)
            #
            #   backfill-openwall line (from outer wrapper):
            #     ts \t backfill-openwall \t range \t scrape-warns \t
            #     top-cat \t top-count \t diff-skips \t ingested
            #     ("diff-skips" = messages openwall served that we already
            #     had — dedup avoided at scrape time)
            #
            # Combined: scraped = added + diff-skipped + failed
            summary="$YEAR"
            if [[ -s metrics/imports.tsv ]]; then
              read total added failed < <(
                awk -F'\t' '$2 == "import-maildir" {t=$3; i=$4; f=$5}
                            END {print t+0, i+0, f+0}' metrics/imports.tsv
              )
              diff_skips=$(awk -F'\t' '$2 == "backfill-openwall" {d=$7}
                                       END {print d+0}' metrics/imports.tsv)
              scraped=$((added + failed + diff_skips))
              # Build a clear message:
              #   "backfill: openwall scrape 2023 (1169 processed: 12 added,
              #    1157 pre-skipped by dedup, 0 failed)"
              # For pure pre-Maildir years (diff_skips=0), collapses to:
              #   "backfill: openwall scrape 2011 (985 added, 0 failed)"
              if [[ "$diff_skips" -gt 0 ]]; then
                summary="$YEAR ($scraped processed: $added added, $diff_skips pre-skipped by dedup"
                [[ "$failed" != "0" ]] && summary="$summary, $failed failed"
                summary="$summary)"
              else
                summary="$YEAR ($added added"
                [[ "$failed" != "0" ]] && summary="$summary, $failed failed"
                summary="$summary)"
              fi
            fi
            git config user.name "oss-security-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "backfill: openwall scrape $summary"

            # Push with rebase-and-retry to survive races with concurrent
            # pushes (workflow ran 2 hours; the maintainer may have pushed
            # a fix commit in the meantime). Without this, a race means
            # rejection at push time, which discards the runner's whole
            # backfill work.
            #
            # git pull --rebase brings origin's newer commits, then
            # replays our new backfill commit on top. If the rebase has
            # conflicts (e.g. inbox/git/0.git/refs/heads/master advanced
            # differently), we fall back to a stash-and-force-push of
            # just our new commit — since the backfill is idempotent and
            # commit-additive, dropping intervening ref changes only
            # discards the ref tracking, not any message data.
            for attempt in 1 2 3; do
              if git pull --rebase origin main 2>&1; then
                if git push origin main 2>&1; then
                  echo "  push succeeded on attempt $attempt"
                  break
                fi
              fi
              if [[ $attempt -eq 3 ]]; then
                echo "  push failed after 3 attempts — bailing" >&2
                exit 1
              fi
              echo "  push attempt $attempt failed, sleeping 30s and retrying..." >&2
              sleep 30
              # If rebase left us in a conflicted state, abort so the
              # next iteration can start clean.
              git rebase --abort 2>/dev/null || true
            done
          fi

      - name: Fail the run if the index export failed
        if: steps.export_index.outcome == 'failure'
        run: |
          echo "index export/verify failed — see the 'Export index' step and status.json" >&2
          exit 1
