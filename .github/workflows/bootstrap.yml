name: Bootstrap historical archive

on:
  workflow_dispatch:
    inputs:
      year_start:
        description: 'Start year (e.g. 2020)'
        required: true
        type: string
      year_end:
        description: 'End year (e.g. 2026). Leave empty for single year.'
        required: false
        type: string

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install public-inbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq public-inbox xapian-tools

      - name: Initialize inbox (idempotent — writes config on every run)
        run: ./scripts/setup-inbox.sh inbox

      - name: Bootstrap
        # Bind inputs to env vars rather than `${{ }}`-expanding them into the
        # shell. Otherwise a year_start value like `2020"; rm -rf / #` would
        # be substituted by Actions BEFORE bash sees it and run arbitrary
        # commands on the runner. workflow_dispatch is gated by repo write
        # permission but this is the standard hardening pattern.
        env:
          INBOX_DIR: inbox
          YEAR_START: ${{ inputs.year_start }}
          YEAR_END: ${{ inputs.year_end }}
        run: |
          if [[ -n "$YEAR_END" ]]; then
            ./scripts/bootstrap.sh "$YEAR_START" "$YEAR_END"
          else
            ./scripts/bootstrap.sh "$YEAR_START"
          fi

      - name: Build indexes
        run: public-inbox-index inbox

      - name: Commit and push
        # Same env-binding rationale as the Bootstrap step above — the commit
        # message would otherwise interpolate untrusted input into a `git
        # commit -m "..."` shell argument.
        env:
          YEAR_START: ${{ inputs.year_start }}
          YEAR_END: ${{ inputs.year_end }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git config user.name "oss-security-bot"
            git config user.email "bot@users.noreply.github.com"
            if [[ -n "$YEAR_END" ]]; then
              msg="bootstrap: oss-security $YEAR_START-$YEAR_END"
            else
              msg="bootstrap: oss-security $YEAR_START"
            fi
            git commit -m "$msg"
            git push
          fi
