name: Import Maildir

on:
  workflow_dispatch:
    inputs:
      maildir_url:
        description: 'HTTPS URL to a .tar.gz containing a Maildir (with cur/ and new/)'
        required: true
        type: string

jobs:
  import:
    runs-on: ubuntu-latest
    # One writer at a time on the epoch: sync, backfill and import share
    # this group so their pushes never race.
    concurrency:
      group: inbox-writer
      cancel-in-progress: false
    permissions:
      contents: write
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark run start (for status.json last_run.duration_s)
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install public-inbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq public-inbox xapian-tools \
            libhtml-format-perl libcpanel-json-xs-perl

      - name: Fetch inbox epoch from oss-security-inbox
        # DEC-ARCHIVE-010: the epoch is its own repository. This clones it
        # into inbox/git/0.git (gitignored here); the rest of the inbox
        # scaffolding (all.git, inbox.lock, description) is tracked.
        run: bash scripts/inbox-repo.sh fetch

      - name: Initialize inbox (idempotent — writes config on every run)
        run: ./scripts/setup-inbox.sh inbox

      - name: Fetch Maildir tarball
        # Bind the input to an env var rather than expanding `${{ }}` directly
        # in the shell — otherwise a maildir_url like `https://x/x.tgz" ;
        # rm -rf / ; echo "` would be interpolated by Actions BEFORE bash
        # sees it, executing arbitrary commands on the runner. Even though
        # workflow_dispatch is gated by repo write permission, env-binding
        # is the standard hardening pattern (GitHub: "Untrusted input" docs).
        env:
          MAILDIR_URL: ${{ inputs.maildir_url }}
        run: |
          curl -fsSL \
            -A "oss-security-archive-bot/1.0 (+https://github.com/joemalcolm/oss-security-archive)" \
            -o maildir.tar.gz \
            "$MAILDIR_URL"
          ls -lh maildir.tar.gz

      - name: Extract and locate Maildir root
        id: extract
        run: |
          mkdir -p tmp/maildir
          tar -xzf maildir.tar.gz -C tmp/maildir
          # Find the directory that contains both cur/ and new/
          root=$(find tmp/maildir -maxdepth 4 -type d -name cur \
                 -exec dirname {} \; | head -1)
          if [[ -z "$root" || ! -d "$root/new" ]]; then
            echo "Error: could not locate a Maildir (dir with cur/ and new/) in tarball" >&2
            find tmp/maildir -maxdepth 3 -type d >&2
            exit 1
          fi
          echo "Found Maildir at $root"
          echo "maildir=$root" >> "$GITHUB_OUTPUT"

      - name: Import messages
        # steps.extract.outputs.maildir comes from our own previous step (a
        # filesystem path we just built), but we still env-bind it so the
        # pattern is consistent and a path containing odd chars can't
        # close the `run` quoting.
        env:
          MAILDIR_ROOT: ${{ steps.extract.outputs.maildir }}
        run: INBOX_DIR=inbox ./scripts/import-maildir.sh "$MAILDIR_ROOT"

      - name: Build indexes
        run: public-inbox-index inbox

      - name: Push inbox epoch to oss-security-inbox
        # Before the index export: new mail is safe even if the export
        # fails. A non-fast-forward rejection means another writer pushed
        # first; the job fails and the next run re-ingests (idempotent).
        env:
          INBOX_PUSH_TOKEN: ${{ secrets.INBOX_PUSH_TOKEN }}
        run: bash scripts/inbox-repo.sh push

      - name: Export index
        # DEC-ARCHIVE-007 / SPEC-index.md. Regenerates index/ (one row per
        # Message-ID — papers over stored duplicates, never purges them),
        # validates it, and writes status.json. On failure the script
        # rolls index/ back to the committed version and records the
        # error in status.json; continue-on-error lets the commit step
        # still push new mail + that error status, and the last step
        # of the job then turns the run red.
        id: export_index
        continue-on-error: true
        env:
          METRICS_LOG: metrics/imports.tsv
        run: bash scripts/publish-index.sh

      - name: Commit and push
        run: |
          # Clean up the workspace tarball + extraction so they don't get committed
          rm -rf tmp/ maildir.tar.gz
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git config user.name "oss-security-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "import: maildir ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Fail the run if the index export failed
        if: steps.export_index.outcome == 'failure'
        run: |
          echo "index export/verify failed — see the 'Export index' step and status.json" >&2
          exit 1
