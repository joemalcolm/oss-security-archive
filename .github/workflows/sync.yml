name: Sync oss-security

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install public-inbox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq public-inbox xapian-tools

      - name: Initialize inbox (idempotent — writes config on every run)
        run: ./scripts/setup-inbox.sh inbox

      - name: Sync recent posts
        run: ./scripts/sync.sh
        env:
          INBOX_DIR: inbox

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new posts to commit."
          else
            git config user.name "oss-security-bot"
            git config user.email "bot@users.noreply.github.com"
            git commit -m "sync: $(date -u +%Y-%m-%d) oss-security posts"
            git push
          fi
