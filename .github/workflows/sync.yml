name: Sync oss-security

# Rolling sync every 4 hours. Uses scripts/sync.sh which wraps
# scripts/backfill-openwall.sh over a yesterday+today window. All
# the hardening the backfill workflow accumulated (--diff-against
# dedup, prime-index-first, metrics-aware commit messages,
# rebase-retry on push, GHA-injection-safe env binding) is inherited
# by inheriting from the same pipeline.

on:
  schedule:
    # Every 4 hours at :07 to avoid the top-of-hour thundering herd.
    - cron: '7 */4 * * *'
  workflow_dispatch:
    inputs:
      days_back:
        description: 'Rolling-window size in days (default 1 = yesterday+today)'
        required: false
        default: '1'
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    # One writer at a time on the epoch: sync, backfill and import share
    # this group so their pushes never race.
    concurrency:
      group: inbox-writer
      cancel-in-progress: false
    permissions:
      contents: write
    timeout-minutes: 60   # sync should be quick — a 4h window has few msgs
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mark run start (for status.json last_run.duration_s)
        run: echo "RUN_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            public-inbox xapian-tools \
            libwww-perl liblwp-protocol-https-perl libhtml-parser-perl \
            libhtml-format-perl libcpanel-json-xs-perl

      - name: Fetch inbox epoch from oss-security-inbox
        # DEC-ARCHIVE-010: the epoch is its own repository. This clones it
        # into inbox/git/0.git (gitignored here); the rest of the inbox
        # scaffolding (all.git, inbox.lock, description) is tracked.
        run: bash scripts/inbox-repo.sh fetch

      - name: Initialize inbox (idempotent — writes config on every run)
        run: ./scripts/setup-inbox.sh inbox

      - name: Prime search index for --diff-against
        # --diff-against in the scraper (via backfill-openwall.sh's
        # DIFF_AGAINST default) queries inbox/xap15/over.sqlite3 to
        # skip messages already in the archive. That file is
        # gitignored so a fresh runner has no index until this step
        # runs. Without it, --diff-against silently no-ops and every
        # yesterday-and-today message re-ingests as a duplicate.
        # Cost: 5-10 min for a 40k-message archive on cold Xapian.
        run: public-inbox-index inbox

      - name: Sync
        env:
          DAYS_BACK: ${{ inputs.days_back || '1' }}
          FAIL_THRESHOLD_PCT: '0'
        run: |
          SYNC_DAYS_BACK="$DAYS_BACK" \
            INBOX_DIR=inbox \
            METRICS_LOG=metrics/imports.tsv \
            FAIL_THRESHOLD_PCT="$FAIL_THRESHOLD_PCT" \
            ./scripts/sync.sh

      - name: Build indexes (incorporate new messages)
        run: public-inbox-index inbox

      - name: Push inbox epoch to oss-security-inbox
        # Before the index export: new mail is safe even if the export
        # fails. A non-fast-forward rejection means another writer pushed
        # first; the job fails and the next run re-ingests (idempotent).
        env:
          INBOX_PUSH_TOKEN: ${{ secrets.INBOX_PUSH_TOKEN }}
        run: bash scripts/inbox-repo.sh push

      - name: Export index
        # DEC-ARCHIVE-007 / SPEC-index.md. Regenerates index/ (one row per
        # Message-ID — papers over stored duplicates, never purges them),
        # validates it, and writes status.json. On failure the script
        # rolls index/ back to the committed version and records the
        # error in status.json; continue-on-error lets the commit step
        # still push new mail + that error status, and the last step
        # of the job then turns the run red.
        id: export_index
        continue-on-error: true
        env:
          METRICS_LOG: metrics/imports.tsv
        run: bash scripts/publish-index.sh

      - name: Commit and push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No new posts to commit."
            exit 0
          fi

          # Extract counts from the metrics lines this run appended.
          # Same logic as the backfill workflow — see backfill-openwall.yml
          # for the format documentation.
          added=0; failed=0; diff_skips=0; total=0
          if [[ -s metrics/imports.tsv ]]; then
            read total added failed < <(
              awk -F'\t' '$2 == "import-maildir" {t=$3; i=$4; f=$5}
                          END {print t+0, i+0, f+0}' metrics/imports.tsv
            )
            diff_skips=$(awk -F'\t' '$2 == "backfill-openwall" {d=$7}
                                     END {print d+0}' metrics/imports.tsv)
          fi
          scraped=$((added + failed + diff_skips))
          ts=$(date -u +%FT%TZ)
          if [[ "$diff_skips" -gt 0 ]]; then
            msg="sync: $ts ($scraped processed: $added added, $diff_skips pre-skipped"
          else
            msg="sync: $ts ($added added"
          fi
          [[ "$failed" != "0" ]] && msg="$msg, $failed failed"
          msg="$msg)"

          git config user.name "oss-security-bot"
          git config user.email "bot@users.noreply.github.com"
          git commit -m "$msg"

          # Rebase-retry same as backfill workflow — see there for
          # the race-condition rationale.
          for attempt in 1 2 3; do
            if git pull --rebase origin main 2>&1; then
              if git push origin main 2>&1; then
                echo "  push succeeded on attempt $attempt"
                break
              fi
            fi
            if [[ $attempt -eq 3 ]]; then
              echo "  push failed after 3 attempts — bailing" >&2
              exit 1
            fi
            echo "  attempt $attempt failed, sleeping 30s..." >&2
            sleep 30
            git rebase --abort 2>/dev/null || true
          done

      - name: Fail the run if the index export failed
        if: steps.export_index.outcome == 'failure'
        run: |
          echo "index export/verify failed — see the 'Export index' step and status.json" >&2
          exit 1
